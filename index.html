<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simanto Ahmmed | Portfolio</title>

    <meta name="description"
          content="Personal portfolio of Simanto Ahmmed - Computer Science & Technology Student, Aspiring Software Engineer and AI & Machine Learning Enthusiast.">

    <meta name="author" content="Simanto Ahmmed">

    <style>

        /* =========================================================
           GLOBAL SETTINGS
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #050816;
            --bg2: #0b1024;
            --card: #10172d;
            --card2: #151d38;

            --primary: #6c63ff;
            --secondary: #00d4ff;
            --accent: #8b5cf6;

            --text: #f8fafc;
            --muted: #a7b0c3;

            --border: rgba(255,255,255,0.08);

            --shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(108,99,255,0.15),
                    transparent 35%
                ),
                radial-gradient(
                    circle at top right,
                    rgba(0,212,255,0.10),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            line-height: 1.7;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .section {
            padding: 110px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title span {
            color: var(--secondary);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section-title h2 {
            font-size: 42px;
            margin-top: 10px;
        }

        .section-title p {
            color: var(--muted);
            max-width: 650px;
            margin: 15px auto 0;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;

            z-index: 999;

            background:
                rgba(5,8,22,0.75);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid var(--border);
        }

        nav {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            gap: 30px;

            list-style: none;
        }

        .nav-links a {
            color: #dbe3f4;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }


        /* =========================================================
           HERO
        ========================================================= */

        #home {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding-top: 100px;
        }

        .hero {
            display: grid;

            grid-template-columns:
                1.2fr 0.8fr;

            gap: 60px;

            align-items: center;
        }

        .hero-content small {
            color: var(--secondary);

            font-size: 15px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .hero-content h1 {
            font-size: clamp(45px, 7vw, 78px);

            line-height: 1.05;

            margin: 18px 0;
        }

        .hero-content h1 span {
            background:
                linear-gradient(
                    90deg,
                    var(--secondary),
                    var(--primary)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content h3 {
            font-size: 25px;
            color: #d9def0;

            margin-bottom: 20px;
        }

        .hero-content p {
            color: var(--muted);

            max-width: 650px;

            font-size: 17px;

            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 13px 25px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.3s;

            border: 1px solid transparent;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 30px
                rgba(0,212,255,0.25);
        }

        .btn-outline {
            border-color: var(--border);

            background:
                rgba(255,255,255,0.03);
        }

        .btn-outline:hover {
            border-color: var(--secondary);

            color: var(--secondary);

            transform: translateY(-4px);
        }


        /* =========================================================
           HERO CARD
        ========================================================= */

        .hero-card {
            position: relative;

            width: 320px;
            height: 320px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            box-shadow:
                0 0 80px
                rgba(0,212,255,0.2);
        }

        .hero-card::before {
            content: "";

            position: absolute;

            width: 285px;
            height: 285px;

            border-radius: 50%;

            background: var(--bg2);
        }

        .hero-card-content {
            position: relative;

            text-align: center;
        }

        .hero-card-content .code {
            font-size: 65px;
            font-weight: bold;

            color: var(--secondary);
        }

        .hero-card-content p {
            color: white;
            font-weight: bold;
        }


        /* =========================================================
           ABOUT
        ========================================================= */

        .about-grid {
            display: grid;

            grid-template-columns:
                0.9fr 1.1fr;

            gap: 60px;

            align-items: center;
        }

        .about-box {
            background:
                linear-gradient(
                    145deg,
                    var(--card),
                    var(--bg2)
                );

            padding: 35px;

            border-radius: 20px;

            border:
                1px solid var(--border);

            box-shadow: var(--shadow);
        }

        .about-box h3 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .about-box p {
            color: var(--muted);
            margin-bottom: 15px;
        }

        .info-list {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-top: 25px;
        }

        .info-item {
            padding: 15px;

            background:
                rgba(255,255,255,0.03);

            border-radius: 10px;

            border:
                1px solid var(--border);
        }

        .info-item strong {
            display: block;

            color: var(--secondary);

            font-size: 13px;
        }


        /* =========================================================
           SKILLS
        ========================================================= */

        .skills-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .skill-card {
            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    var(--card),
                    var(--card2)
                );

            border:
                1px solid var(--border);

            border-radius: 18px;

            transition: 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-8px);

            border-color:
                rgba(0,212,255,0.4);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.3);
        }

        .skill-icon {
            width: 55px;
            height: 55px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                rgba(108,99,255,0.15);

            font-size: 25px;

            margin-bottom: 20px;
        }

        .skill-card h3 {
            margin-bottom: 10px;
        }

        .skill-card p {
            color: var(--muted);

            font-size: 14px;
        }


        /* =========================================================
           SERVICES
        ========================================================= */

        .services-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }

        .service {
            padding: 35px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid var(--border);

            transition: 0.3s;
        }

        .service:hover {
            background:
                rgba(108,99,255,0.08);

            transform: translateY(-8px);
        }

        .service-number {
            font-size: 14px;

            color: var(--secondary);

            margin-bottom: 20px;
        }

        .service h3 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .service p {
            color: var(--muted);
        }


        /* =========================================================
           PROJECTS
        ========================================================= */

        .projects-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }

        .project {
            overflow: hidden;

            border-radius: 18px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-8px);
        }

        .project-image {
            height: 190px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #151b3d,
                    #0c2333
                );

            font-size: 45px;
        }

        .project-content {
            padding: 25px;
        }

        .project-content h3 {
            margin-bottom: 10px;
        }

        .project-content p {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 15px;
        }

        .tags {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        .tag {
            padding: 5px 10px;

            font-size: 11px;

            border-radius: 20px;

            color: var(--secondary);

            background:
                rgba(0,212,255,0.08);
        }


        /* =========================================================
           EDUCATION
        ========================================================= */

        .timeline {
            max-width: 850px;

            margin: auto;

            position: relative;
        }

        .timeline::before {
            content: "";

            position: absolute;

            left: 20px;
            top: 0;
            bottom: 0;

            width: 2px;

            background:
                linear-gradient(
                    var(--secondary),
                    var(--primary)
                );
        }

        .timeline-item {
            position: relative;

            padding-left: 65px;

            margin-bottom: 45px;
        }

        .timeline-dot {
            position: absolute;

            left: 10px;
            top: 5px;

            width: 22px;
            height: 22px;

            border-radius: 50%;

            background:
                var(--secondary);

            box-shadow:
                0 0 20px
                rgba(0,212,255,0.5);
        }

        .timeline-item h3 {
            font-size: 22px;
        }

        .timeline-item span {
            color: var(--secondary);

            font-size: 14px;
        }

        .timeline-item p {
            color: var(--muted);

            margin-top: 8px;
        }


        /* =========================================================
           INTERESTS
        ========================================================= */

        .interest-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .interest {
            padding: 25px 15px;

            text-align: center;

            border:
                1px solid var(--border);

            border-radius: 15px;

            background:
                rgba(255,255,255,0.025);

            transition: 0.3s;
        }

        .interest:hover {
            transform: translateY(-5px);

            border-color:
                var(--secondary);
        }

        .interest div {
            font-size: 30px;

            margin-bottom: 10px;
        }

        .interest p {
            font-size: 14px;
        }


        /* =========================================================
           SKILL BARS
        ========================================================= */

        .progress-wrapper {
            max-width: 900px;

            margin: auto;
        }

        .progress-item {
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;
        }

        .progress-header span:last-child {
            color: var(--secondary);
        }

        .progress-bar {
            height: 9px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.08);

            overflow: hidden;
        }

        .progress {
            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );
        }


        /* =========================================================
           CONTACT
        ========================================================= */

        .contact-grid {
            display: grid;

            grid-template-columns:
                0.8fr 1.2fr;

            gap: 35px;
        }

        .contact-info,
        .contact-form {
            padding: 35px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 20px;
        }

        .contact-info h3,
        .contact-form h3 {
            font-size: 25px;

            margin-bottom: 20px;
        }

        .contact-info p {
            color: var(--muted);

            margin-bottom: 20px;
        }

        .contact-item {
            padding: 15px 0;

            border-bottom:
                1px solid var(--border);
        }

        .contact-item strong {
            display: block;

            color: var(--secondary);

            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,0.04);

            color: white;

            outline: none;

            font-family: inherit;
        }

        textarea {
            min-height: 150px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color:
                var(--secondary);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding: 35px 0;

            border-top:
                1px solid var(--border);

            text-align: center;
        }

        footer p {
            color: var(--muted);

            font-size: 14px;
        }

        .socials {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-bottom: 15px;
        }

        .socials a {
            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.05);

            transition: 0.3s;
        }

        .socials a:hover {
            background:
                var(--primary);

            transform: translateY(-3px);
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {

            .hero,
            .about-grid,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                text-align: center;
            }

            .hero-content p {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            .skills-grid,
            .services-grid,
            .projects-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .interest-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
